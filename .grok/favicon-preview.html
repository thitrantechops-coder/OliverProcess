<!doctype html><html><body style="margin:0;background:#888">
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c32" width="32" height="32"></canvas>
<script>
const svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\">\n  <rect width=\"32\" height=\"32\" rx=\"8\" fill=\"#0E2A47\"/>\n  <circle cx=\"16\" cy=\"16\" r=\"8\" fill=\"none\" stroke=\"#C4A265\" stroke-width=\"4\"/>\n</svg>";
const blob = new Blob([svg], {type:'image/svg+xml'});
const url = URL.createObjectURL(blob);
const img = new Image();
img.onload = () => {
  for (const id of ['c16','c32']) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
  }
  document.title = 'ready';
};
img.src = url;
</script></body></html>
